name: Production security scan
on:
    pull_request:
    push:
        branches: [main, QA_main]
permissions:
    contents: read
    security-events: write
    actions:  read
    packages: read

# start to scan the project filesystem and license and vlun
jobs:
   security-scan-on-dedence:
    name: 'Filesystem — secrets, licenses, vulns'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

    # # ── STEP 1: Secrets scan — BLOCKS on any secret found ─────────
      - name: 'Secrets scan'
        uses: aquasecurity/trivy-action@0.24.0   # pinned — never @master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
        continue-on-error: false
    
      # ── STEP 2: License scan — BLOCKS on copyleft licenses ────────
      - name: 'License scan'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          exit-code: '1'
        continue-on-error: false

     # ── STEP 3: Vulnerability scan — BLOCKS on HIGH/CRITICAL ──────
      - name: 'Vulnerability scan'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'           # BUG FIX: was 'fS' (capital S) — now correctly lowercase
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
     # ── STEP 4a: Generate SARIF report so that github api can create ui (all scanners, one pass) ───
      - name: 'Generate SARIF report'
        id: sarif_scan
        uses: aquasecurity/trivy-action@0.24.0
        if: always()   
        # even the fail also show the results
        with:
            scan-type: 'fs'
            scan-ref: '.'
            scanners: 'vuln,secret,license'
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'MEDIUM,HIGH,CRITICAL'
            ignore-unfixed: true

    # ── STEP 4b: Upload SARIF → GitHub Security tab ───────────────
      - name: 'Upload SARIF to Security tab'
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs-scan'  

   # ── STEP 4a: Generate SARIF report so that github api can create ui (all scanners, one pass) ───
      - name: 'Generate SARIF report'
        id: json_scan
        uses: aquasecurity/trivy-action@0.24.0
        if: always()   
        # even the fail also show the results
        with:
            scan-type: 'fs'
            scan-ref: '.'
            scanners: 'vuln,secret,license'
            format: 'json'
            output: 'trivy-results.json'
            severity: 'MEDIUM,HIGH,CRITICAL'
            ignore-unfixed: true
    
# ── STEP 5b: Parse JSON — extract real counts ─────────────────
      - name: 'Parse scan results'
        id: parse_results
        if: always()

        # jq is a command-line tool used to read, filter, and process JSON data.
        # inide the json take the result [] → loop through array

        # ?   ignore if missing (no crash
        # [  ]->  Wrap everything into a list
        # | length -> Count items in that list
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
          HIGH=$(jq     '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' trivy-report.json 2>/dev/null || echo 0)
          MEDIUM=$(jq   '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")]   | length' trivy-report.json 2>/dev/null || echo 0)
          SECRETS=$(jq  '[.Results[]?.Secrets[]?]                                         | length' trivy-report.json 2>/dev/null || echo 0)
          LICENSES=$(jq '[.Results[]?.Licenses[]?]                                        | length' trivy-report.json 2>/dev/null || echo 0)

          echo "critical=$CRITICAL"   >> $GITHUB_OUTPUT
          echo "high=$HIGH"           >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM"       >> $GITHUB_OUTPUT
          echo "secrets=$SECRETS"     >> $GITHUB_OUTPUT
          echo "licenses=$LICENSES"   >> $GITHUB_OUTPUT

          echo "FS SCAN → CRITICAL=> $CRITICAL HIGH=> $HIGH MEDIUM=> $MEDIUM SECRETS=$SECRETS LICENSES=$LICENSES"
 
 # ── STEP 5c: Upload JSON artifact ─────────────────────────────
      - name: 'Upload JSON artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-report-${{ github.run_number }}-${{ github.sha }}
        # github.sha indicates the comit id
          path: trivy-report.json
          retention-days: 90
          if-no-files-found: warn

# ── STEP 6: Dynamic summary ────────────────────────────────────
      - name: 'Write job summary'
        if: always()
        env:
          CRITICAL:  ${{ steps.parse_results.outputs.critical }}
          HIGH:      ${{ steps.parse_results.outputs.high }}
          MEDIUM:    ${{ steps.parse_results.outputs.medium }}
          SECRETS:   ${{ steps.parse_results.outputs.secrets }}
          LICENSES:  ${{ steps.parse_results.outputs.licenses }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA_SHORT: ${{ github.sha }}
        # $CRITICAL > 0
        run: |
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$SECRETS" -gt 0 ]; then
            STATUS="FAILED"; ICON="x"
          else
            STATUS="PASSED"; ICON="white_check_mark"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## :${ICON}: Filesystem scan — ${STATUS}

          | Scanner      | Found      | Threshold |
          |------------- |------------|-----------|
          | Secrets      | ${SECRETS} | Any → fail |
          | Licenses     | ${LICENSES}| Copyleft → fail |
          | CRITICAL vulns | ${CRITICAL} | > 0 → fail |
          | HIGH vulns   | ${HIGH}    | > 0 → fail |
          | MEDIUM vulns | ${MEDIUM}  | report only |

          **Commit:** \`${SHA_SHORT:0:7}\` · [View run](${RUN_URL})
          EOF