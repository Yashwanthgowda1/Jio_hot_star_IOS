name: Terraform Deploy

on:
   push:
    branches: [ "QA_main"]

env:
  AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION:            ${{ secrets.AWS_REGION }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:

      # step 1 — checkout your code
      - name: Checkout code
        uses: actions/checkout@v3

      # step 2 — install terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # step 3 — terraform init
      - name: Terraform Init
        run: terraform init

      # step 4 — check formatting
      - name: Terraform Format
        run: terraform fmt -check

      # step 5 — validate code
      - name: Terraform Validate
        run: terraform validate

      # step 6 — plan (shows what will be created)
      - name: Terraform Plan
        run: terraform plan -var-file="terraform/terraform.tfvars"

      # step 7 — apply (only on push to main)
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/Qa_main' ||  github.ref == 'refs/heads/main')  && github.event_name == 'push'
        run: terraform apply -auto-approve -var-file="terraform/terraform.tfvars"